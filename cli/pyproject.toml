[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrechnung-check"
version = "0.2.0"
description = "CLI for the free XRechnung / ZUGFeRD / Factur-X validator API at checkxrechnung.com"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bobook Limited", email = "info@bobook.club" }]
keywords = ["xrechnung", "zugferd", "e-invoicing", "en16931", "validator", "einvoice", "germany"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://checkxrechnung.com"
Documentation = "https://checkxrechnung.com/en/docs"
Repository = "https://github.com/wenboteng/xrechnung-validator"
"API waitlist" = "https://checkxrechnung.com/api-waitlist"
Changelog = "https://checkxrechnung.com/changelog"

[project.scripts]
xrechnung-check = "xrechnung_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
